services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - tanaw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend-tanaw
      target: production
    env_file:
      - .env
    environment:
      ASSET_STORAGE_ROOT: /var/lib/tanaw/assets
    command: uv run alembic upgrade head
    volumes:
      - tanaw-assets:/var/lib/tanaw/assets
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend-tanaw
      target: production
    env_file:
      - .env
    environment:
      ASSET_STORAGE_ROOT: /var/lib/tanaw/assets
      FINAL_REPORT_ARTIFACT_STORAGE_ROOT: /var/lib/tanaw/final-report-artifacts
    volumes:
      - tanaw-assets:/var/lib/tanaw/assets
      - tanaw-final-report-artifacts:/var/lib/tanaw/final-report-artifacts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend-tanaw
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        TANAW_PUBLIC_DEPLOYMENT: ${TANAW_PUBLIC_DEPLOYMENT:-false}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  tanaw-postgres-data:
  tanaw-assets:
  tanaw-final-report-artifacts:
