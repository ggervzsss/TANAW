<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="2048x2048" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TANAW</title>
    <style>
      html,
      body,
      #root {
        --tanaw-gold: #d7b35a;
        --tanaw-gold-deep: #b68a2d;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f7f7f3;
      }

      .tanaw-boot-splash {
        display: grid;
        min-height: 100%;
        place-items: center;
        color: #10241b;
        font-family:
          "Bai Jamjuree",
          "Montserrat",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }

      .tanaw-boot-card {
        position: relative;
        width: clamp(46rem, 52vw, 58rem);
        max-width: calc(100vw - 3rem);
        max-height: calc(100vh - 4.5rem);
        aspect-ratio: 479 / 270;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #ffffff url("./media/loading-page-poster.jpg") center / cover no-repeat;
        border: 1px solid rgb(15 23 42 / 0.16);
        border-radius: 8px;
        box-shadow: 0 26px 68px rgb(15 23 42 / 0.18);
      }

      .tanaw-boot-card video {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: transparent;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      html[data-boot-video-state="fallback"] .tanaw-boot-card video {
        opacity: 0;
      }

      .tanaw-boot-active-loader {
        position: absolute;
        bottom: clamp(0.85rem, 3.4%, 1.4rem);
        left: 50%;
        z-index: 3;
        width: 5.9rem;
        height: 4.45rem;
        display: grid;
        place-items: center;
        transform: translateX(-50%);
        border: 1px solid rgb(215 179 90 / 0.46);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 38%, rgb(255 255 255 / 0.98), rgb(247 247 243 / 0.96) 62%, rgb(247 247 243 / 0.9) 100%);
        box-shadow:
          0 12px 28px rgb(15 23 42 / 0.08),
          0 0 0 6px rgb(247 247 243 / 0.36);
        backdrop-filter: blur(6px);
      }

      .tanaw-boot-active-loader::before {
        content: "";
        width: 1.45rem;
        height: 1.45rem;
        border: 2px solid rgb(215 179 90 / 0.22);
        border-top-color: var(--tanaw-gold);
        border-right-color: var(--tanaw-gold-deep);
        border-radius: 999px;
        box-shadow: 0 0 16px rgb(215 179 90 / 0.22);
        animation: tanaw-boot-spin 0.86s linear infinite;
      }

      .tanaw-boot-active-loader::after {
        content: "";
        position: absolute;
        bottom: 0.95rem;
        width: 2.4rem;
        height: 0.18rem;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--tanaw-gold), transparent);
        opacity: 0.8;
      }

      @keyframes tanaw-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="tanaw-boot-splash" aria-label="TANAW loading">
        <div class="tanaw-boot-card">
          <video
            autoplay
            loop
            muted
            playsinline
            poster="./media/loading-page-poster.jpg"
            aria-label="TANAW startup splash"
            onerror="document.documentElement.dataset.bootVideoState='fallback'"
          >
            <source src="./media/loading-page.mp4" type="video/mp4" />
          </video>
          <div class="tanaw-boot-active-loader" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
