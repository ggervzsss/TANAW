[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.20",
    "opencv-python>=4.13.0.92",
    "openvino>=2026.2.0",
    "pydantic>=2.13.4",
    "tzdata>=2026.2",
    "ultralytics>=8.4.60",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.410",
    "ruff>=0.15.18",
]
export = [
    "gdown>=6.1.0",
    "onnx>=1.21.0",
    "onnxscript>=0.7.0",
    "tensorboard>=2.20.0",
    "torchreid>=0.2.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "gdown.*",
    "onnx.*",
    "onnxruntime.*",
    "openvino.*",
    "torch.*",
    "torchreid.*",
    "ultralytics.*",
]
ignore_missing_imports = true
