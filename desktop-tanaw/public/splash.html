<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TANAW</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./splash.css" />
  </head>
  <body>
    <div class="tanaw-boot-splash" aria-label="TANAW startup loading screen">
      <div class="tanaw-boot-card">
        <video autoplay loop muted playsinline poster="./media/loading-page-poster.jpg" aria-label="TANAW startup splash">
          <source src="./media/loading-page.mp4" type="video/mp4" />
        </video>
        <div class="tanaw-boot-loader-mask" aria-hidden="true"></div>
        <div class="tanaw-boot-progress" aria-hidden="true">
          <span class="tanaw-boot-progress__track"></span>
          <span class="tanaw-boot-progress__fill"></span>
        </div>
      </div>
    </div>
    <script src="./splash.js"></script>
  </body>
</html>
